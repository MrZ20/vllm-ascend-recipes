api_version: multi-node/v1
kind: MultiNodePlan

metadata:
  name: qwen3-30b-a3b-dp-2n2c

model:
  id: Qwen/Qwen3-30B-A3B
  cache_path: Qwen/Qwen3-30B-A3B
  served_name: qwen3

resources:
  npu_per_node: 2

nodes:
  - id: node0
    role: api
    launch: nodes/node0/run.sh
    readiness:
      port_start: 7100

  - id: node1
    role: headless
    launch: nodes/node1/run.sh

stages:
  - id: completion
    failure_category: check_failed
    steps:
      - id: completion
        script: checks/completion.sh
        timeout_seconds: 300
  - id: accuracy
    failure_category: evaluation_failed
    steps:
      - id: gsm8k
        script: evaluations/run_aisbench.sh
        timeout_seconds: 7200
        inputs:
          aisbench:
            case_type: accuracy
            dataset_path: vllm-ascend/gsm8k-lite
            dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
            request_conf: vllm_api_general_chat
            num_prompts: 1
            max_out_len: 16
            batch_size: 1
            temperature: 0.01
            dump_eval_details: true
  - id: performance
    failure_category: evaluation_failed
    steps:
      - id: gsm8k-perf
        script: evaluations/run_aisbench.sh
        timeout_seconds: 7200
        inputs:
          aisbench:
            case_type: performance
            dataset_path: vllm-ascend/GSM8K-in3500-bs400
            dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
            request_conf: vllm_api_stream_chat
            num_prompts: 1
            max_out_len: 16
            batch_size: 1
            request_rate: 0
            temperature: 0.01
            summarizer: default_perf
